<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Us - Cyberstore</title>

    <!-- Style -->
    <link rel="stylesheet" href="./assets/css/style2.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container header-container">
        <div class="nav-left">
            <h5>Super Deals</h5>
            <h5>Featured Brands</h5>
            <h5>Trending Styles</h5>
            <h5>Gift Cards</h5>
        </div>

        <div class="nav-right">
            <div class="nav-item location">
                <i class="fa-solid fa-location-dot"></i>
                <h5>Store Locator</h5>
            </div>

            <div class="nav-item track-order">
                <i class="fa-solid fa-gauge-simple-high"></i>
                <h5>Track Order</h5>
            </div>

            <div class="nav-item account">
                <i class="fa-solid fa-user"></i>
                <h5>Account</h5>
            </div>
        </div>
    </div>
</header>

<section class="main-bar">
    <div class="container main-bar-container">
        <div class="cyberstore-left">
            <span class="cyberstore-logo">CYBERSTORE</span>
            <span class="cyberstore-dot"></span>
        </div>

        <div class="navigation-menu">
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="#">Pages</a>
                <a href="#">Shop</a>
                <a href="#">Blog</a>
                <a href="#">Elements</a>
            </nav>
        </div>

        <div class="search-field-compact">
            <input type="text" placeholder="Search...">
            <button class="search-button-compact" type="button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="header-icons">
            <button class="icon-button" type="button">
                <i class="fa-regular fa-heart"></i>
            </button>

            <button class="icon-button" type="button">
                <i class="fa-regular fa-user"></i>
            </button>

            <button class="cart-button" type="button">
                <div class="cart-icon-wrapper">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge">0</span>
                </div>
            </button>
        </div>
    </div>
</section>

<section class="contact-banner">
    <div class="contact-banner-content">
        <h1>CONTACT US</h1>
        <p class="breadcrumb">Home / Contact Us</p>
    </div>
</section>

</body>
</html>
