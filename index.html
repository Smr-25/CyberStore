<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cyberstore</title>

    <!-- Style -->
    <link rel="stylesheet" href="./assets/css/style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<header class="header">
    <div class="container">
        <div class="nav-left">
            <h5>Super Deals</h5>
            <h5>Featured Brands</h5>
            <h5>Trending Styles</h5>
            <h5>Gift Cards</h5>
        </div>

        <div class="nav-right">
            <div class="nav-item location">
                <i class="fa-solid fa-location-dot"></i>
                <h5>Store Locator</h5>
            </div>

            <div class="nav-item track-order">
                <i class="fa-solid fa-gauge-simple-high"></i>
                <h5>Track Order</h5>
            </div>

            <div class="nav-item account">
                <i class="fa-solid fa-user"></i>
                <h5>Account</h5>
            </div>
        </div>
    </div>
</header>

<section class="cyberstore-bar">
    <div class="cyberstore-left">
        <span class="cyberstore-logo">CYBERSTORE</span>
        <span class="cyberstore-dot"></span>
    </div>
</section>

<section class="search-section">
    <div class="search-container">

        <button class="category-select">
            <span>All Categories</span>
            <i class="fa-solid fa-chevron-down"></i>
        </button>

        <div class="search-field">
            <input type="text" placeholder="Search for Product...">
            <button class="search-button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="search-actions">

            <button class="filter-button">
                <i class="fa-solid fa-sliders-h"></i>
                <span>Filter</span>
            </button>

            <button class="icon-button">
                <i class="fa-regular fa-heart"></i>
            </button>

            <button class="cart-button">
                <div class="cart-icon-wrapper">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge">0</span>
                </div>
                <span class="cart-amount">(0$)</span>
            </button>

        </div>
    </div>
</section>

<script src="./assets/js/script.js"></script>
</body>
</html>
